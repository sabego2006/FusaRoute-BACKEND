# PRE — el ensayo general, con datos de prueba. DIFERIDO: no existe todavia.
# Decision del 2026-10-01 (SCRUM-128): el plan gratis de Supabase permite 2 proyectos
# activos por organizacion (ya los ocupan fusaroute-dev y fusaroute-prod) y las
# 750 h/mes gratis de Render alcanzan para un solo servicio 24/7. Las claves quedan
# declaradas para que el perfil exista en estructura cuando haya donde montarlo.

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# En PRE y PROD el esquema no lo genera Hibernate: se aplica con migraciones.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

google.maps.api.key=${GOOGLE_MAPS_API_KEY}

# Secreto Base64 (>= 32 bytes) para firmar los JWT. Sin valor por defecto: si falta
# o es debil, el arranque falla. Ver JwtConfig y .env.example.
app.jwt.secret=${JWT_SECRET}

# Origenes que pueden llamar a la API desde el navegador. Sin valor por defecto:
# en un ambiente que no es local, un origen equivocado tiene que romper el
# arranque, no colarse en silencio.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
