# DEV — proyecto Supabase compartido (fusaroute-dev), rol fusaroute_dev sobre
# el esquema fusaroute. Ya no es una base local por integrante.
# Los valores salen del .env propio, nunca de este archivo. Ver .env.example.

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

google.maps.api.key=${GOOGLE_MAPS_API_KEY}

# Origenes que pueden llamar a la API desde el navegador.
# 4200 es 'ng serve'; 8081 es el build servido a mano para probar la PWA.
# Secreto Base64 (>= 32 bytes) para firmar los JWT. Sin valor por defecto: si falta
# o es debil, el arranque falla. Ver JwtConfig y .env.example.
app.jwt.secret=${JWT_SECRET}

# SCRUM-179 — Segundo factor TOTP:
#   - app.totp.issuer: nombre que aparece en la app autenticadora (Microsoft/Google).
#   - app.totp.encryption-key: Base64 >= 32 bytes para cifrar en reposo el secreto
#     TOTP (AES-256-GCM). Sin default a proposito: si falta, el arranque falla.
app.totp.issuer=${TOTP_ISSUER:FusaRoute}
app.totp.encryption-key=${TOTP_ENCRYPTION_KEY}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:8081}

# Probe de RNF-01 habilitado por defecto en DEV: no hay /api/routes/search (RF-04)
# todavia, asi que es la unica forma de validar cache y metricas de Google Maps
# antes de que ese endpoint exista.
fusaroute.internal.maps-probe-enabled=${MAPS_PROBE_ENABLED:true}
management.endpoint.health.show-details=always
