# PROD — proyecto Supabase con las rutas reales. Lo que ve el comite.
# Se monta en el Sprint 2: hoy las claves existen declaradas y vacias.
#
# Declarado sin adornos: PROD no esta desplegado todavia. Se despliega en el
# Sprint 3 (29-sep a 5-oct) en Render (tier gratis) con frontend en Vercel.

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

google.maps.api.key=${GOOGLE_MAPS_API_KEY}

# Origenes que pueden llamar a la API desde el navegador. Sin valor por defecto:
# en un ambiente que no es local, un origen equivocado tiene que romper el
# arranque, no colarse en silencio.
# Secreto Base64 (>= 32 bytes) para firmar los JWT. Sin valor por defecto: si falta
# o es debil, el arranque falla. Ver JwtConfig y .env.example.
app.jwt.secret=${JWT_SECRET}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
