# PROD — proyecto Supabase fusaroute-prod (rol fusaroute_prod, esquema fusaroute),
# backend en Render (tier gratis, ver render.yaml) y frontend en Vercel. Lo que ve
# el comite. Desplegado en el Sprint 3 (SCRUM-128).
# Todos los valores llegan por variables de entorno del servicio en Render.

# Session pooler de Supabase (5432). Ver render.yaml para el porque.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Pool chico a proposito: el pooler del plan gratis de Supabase tiene un cupo corto
# de conexiones por proyecto, y cada conexion abierta ocupa memoria en una instancia
# de 512 MB. Con el trafico del comite, 5 sobran.
spring.datasource.hikari.maximum-pool-size=5

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

google.maps.api.key=${GOOGLE_MAPS_API_KEY}

# Secreto Base64 (>= 32 bytes) para firmar los JWT. Sin valor por defecto: si falta
# o es debil, el arranque falla. Ver JwtConfig y .env.example.
app.jwt.secret=${JWT_SECRET}

# Origenes que pueden llamar a la API desde el navegador. Sin valor por defecto:
# en un ambiente que no es local, un origen equivocado tiene que romper el
# arranque, no colarse en silencio.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
