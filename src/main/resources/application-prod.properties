# PROD — proyecto Supabase con las rutas reales. Lo que ve el comite.
# Se monta en el Sprint 2: hoy las claves existen declaradas y vacias.
#
# Declarado sin adornos: PROD no esta desplegado en ningun servidor este
# semestre. El backend corre desde un portatil el dia de la demostracion.

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

google.maps.api.key=${GOOGLE_MAPS_API_KEY}

# Origenes que pueden llamar a la API desde el navegador. Sin valor por defecto:
# en un ambiente que no es local, un origen equivocado tiene que romper el
# arranque, no colarse en silencio.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
