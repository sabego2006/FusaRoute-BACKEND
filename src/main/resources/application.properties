# Configuracion comun a los tres ambientes.
# El codigo nunca cambia entre ambientes; lo que cambia es cual de los
# application-{perfil}.properties se activa. Ver seccion "Ambientes y
# configuracion" del CLAUDE.md de este repo.

spring.config.import=optional:file:./.env[.properties]

spring.application.name=fusaroute-backend
spring.profiles.active=${SPRING_PROFILE:dev}
server.port=${PORT:8080}

# El dominio no debe depender de una sesion de persistencia abierta en la vista.
spring.jpa.open-in-view=false

# --- Esquema de base de datos: lo versiona Flyway, no Hibernate ---
# Decision del 2026-09-21 (SCRUM-161). Con tres bases Supabase y sin migraciones
# habria que crear el esquema a mano tres veces y mantenerlo sincronizado; con
# Flyway el cambio viaja como un .sql revisable en el PR y se aplica igual en los
# tres ambientes. Es tambien la respuesta a "como controlan los cambios de
# esquema?" ante el Comite de Arquitectura.
#
# Supabase entrega una sola base, siempre llamada 'postgres', asi que el
# aislamiento por ambiente lo da el esquema y el rol dueno, no una base aparte.
# El rol fusaroute_dev ya trae search_path=fusaroute, pero se declara explicito
# aqui para que el arranque no dependa de una propiedad del rol en el servidor.
spring.flyway.schemas=${DB_SCHEMA:fusaroute}

# V21 y V22 (SCRUM-188) entraron a main DESPUES de V24 (SCRUM-186) y V25 (SCRUM-P4). Una base que ya aplico V24/V25
# rechazaria el arranque con "Detected resolved migration not applied" si no se permite aplicar las pendientes de
# version menor. En una base nueva el orden es el normal; esto solo cubre las ya desplegadas.
spring.flyway.out-of-order=true
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:fusaroute}

# --- RNF-01 (SCRUM-127): instrumento de rendimiento ---
# El p95 de RNF-01 se mide sobre http.server.requests; se declara aqui el
# histograma y los percentiles para que /actuator/metrics y /actuator/prometheus
# ya traigan el percentil 95 sin que cada endpoint lo pida por su cuenta.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99
# Los nombres de abajo van tal cual los registra el codigo (ojo con travel_time,
# que lleva guion bajo): Micrometer no hace relaxed binding sobre el nombre del
# meter, asi que una sola letra distinta deja la property sin efecto y el
# percentil deja de publicarse, en silencio. Lo fija MetricsPercentilesTest.
management.metrics.distribution.percentiles.fusaroute.maps.travel_time=0.5,0.95,0.99
# Timer propio de la busqueda de ruta (SCRUM-53). El p95 del endpoint ya sale de
# http.server.requests; este mide solo el caso de uso, sin el costo de la capa web.
management.metrics.distribution.percentiles.fusaroute.search.route.latency=0.5,0.95,0.99

# --- SCRUM-186: logs y eventos de uso guardados en la base ---
# Escritura asincrona y acotada: si la base va lenta o esta caida se descartan eventos
# (contador fusaroute.monitoring.dropped) en vez de frenar la peticion del usuario.
# queue-size, batch-size y flush-interval-ms los lee logback-spring.xml (appender) y
# AsyncUsageEventRecorder (eventos de uso): una sola configuracion para las dos colas.
# El plan gratis de Supabase son 500 MB; 30 dias de retencion los mantiene muy por debajo.
app.logs.retention-days=30
app.logs.queue-size=1000
app.logs.batch-size=50
app.logs.flush-interval-ms=1000
# Purga diaria a las 03:15 (America/Bogota). Ademas corre una vez en cada arranque:
# Render duerme el servicio y el cron diario puede no llegar a dispararse.
app.logs.purge-cron=0 15 3 * * *

# Cache de tiempos de viaje por par origen-destino, TTL 5 min: no es una
# optimizacion opcional, es parte del diseno de RNF-01 (ver CLAUDE.md).
spring.cache.type=caffeine
spring.cache.cache-names=googleMapsTravelTime
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=5m

# Base URL de la API de Google Maps; separada de la api key para poder apuntar
# a un stub en pruebas sin tocar el secreto.
google.routes.base-url=${GOOGLE_ROUTES_BASE_URL:https://routes.googleapis.com}

# Presupuesto de tiempo de la llamada a Google (T15, SCRUM-199). Medido contra PROD:
# en estado estable Google aporta menos de 0,2 s y la primera llamada del dia unos
# 2,3 s. Con 1,5 + 3 s el peor caso baja de 7 s a 4,5 s sin cortar ninguna llamada
# que iba a terminar; pasado el presupuesto la busqueda se entrega con etaSource
# ESTIMATED, nunca con error. Ver MapsConfig.
google.routes.connect-timeout-ms=${GOOGLE_ROUTES_CONNECT_TIMEOUT_MS:1500}
google.routes.read-timeout-ms=${GOOGLE_ROUTES_READ_TIMEOUT_MS:3000}

# Endpoint interno para validar el instrumento de RNF-01 (cache + metricas) antes
# de que exista /api/routes/search (RF-04, pendiente). Apagado salvo que un
# perfil lo encienda explicitamente.
fusaroute.internal.maps-probe-enabled=${MAPS_PROBE_ENABLED:false}

# Dispositivo de confianza del segundo factor (decision de producto del
# 17-nov-2026, SCRUM-196): un USER no repite el TOTP en el mismo dispositivo durante este
# numero de dias fijos desde el ultimo codigo correcto; un ADMIN jamas lo usa
# (LoginService decide por rol, nunca por lo que diga el cliente).
fusaroute.totp.trust-days=${TOTP_TRUST_DAYS:15}
