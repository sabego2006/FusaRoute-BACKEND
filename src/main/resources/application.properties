# Configuracion comun a los tres ambientes.
# El codigo nunca cambia entre ambientes; lo que cambia es cual de los
# application-{perfil}.properties se activa. Ver seccion "Ambientes y
# configuracion" del CLAUDE.md de este repo.

spring.config.import=optional:file:./.env[.properties]

spring.application.name=fusaroute-backend
spring.profiles.active=${SPRING_PROFILE:dev}
server.port=${PORT:8080}

# El dominio no debe depender de una sesion de persistencia abierta en la vista.
spring.jpa.open-in-view=false

# --- Esquema de base de datos: lo versiona Flyway, no Hibernate ---
# Decision del 2026-09-21 (SCRUM-161). Con tres bases Supabase y sin migraciones
# habria que crear el esquema a mano tres veces y mantenerlo sincronizado; con
# Flyway el cambio viaja como un .sql revisable en el PR y se aplica igual en los
# tres ambientes. Es tambien la respuesta a "como controlan los cambios de
# esquema?" ante el Comite de Arquitectura.
#
# Supabase entrega una sola base, siempre llamada 'postgres', asi que el
# aislamiento por ambiente lo da el esquema y el rol dueno, no una base aparte.
# El rol fusaroute_dev ya trae search_path=fusaroute, pero se declara explicito
# aqui para que el arranque no dependa de una propiedad del rol en el servidor.
spring.flyway.schemas=${DB_SCHEMA:fusaroute}
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:fusaroute}

# --- RNF-01 (SCRUM-127): instrumento de rendimiento ---
# El p95 de RNF-01 se mide sobre http.server.requests; se declara aqui el
# histograma y los percentiles para que /actuator/metrics y /actuator/prometheus
# ya traigan el percentil 95 sin que cada endpoint lo pida por su cuenta.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99
management.metrics.distribution.percentiles.fusaroute.search.route.latency=0.5,0.95,0.99
management.metrics.distribution.percentiles.fusaroute.maps.travel-time=0.5,0.95,0.99

# Cache de tiempos de viaje por par origen-destino, TTL 5 min: no es una
# optimizacion opcional, es parte del diseno de RNF-01 (ver CLAUDE.md).
spring.cache.type=caffeine
spring.cache.cache-names=googleMapsTravelTime
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=5m

# Base URL de la API de Google Maps; separada de la api key para poder apuntar
# a un stub en pruebas sin tocar el secreto.
google.maps.base-url=${GOOGLE_MAPS_BASE_URL:https://maps.googleapis.com/maps/api}

# Endpoint interno para validar el instrumento de RNF-01 (cache + metricas) antes
# de que exista /api/routes/search (RF-04, pendiente). Apagado salvo que un
# perfil lo encienda explicitamente.
fusaroute.internal.maps-probe-enabled=${MAPS_PROBE_ENABLED:false}
