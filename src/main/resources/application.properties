# Configuracion comun a los tres ambientes.
# El codigo nunca cambia entre ambientes; lo que cambia es cual de los
# application-{perfil}.properties se activa. Ver seccion "Ambientes y
# configuracion" del CLAUDE.md de este repo.

spring.config.import=optional:file:./.env[.properties]

spring.application.name=fusaroute-backend
spring.profiles.active=${SPRING_PROFILE:dev}
server.port=${PORT:8080}

# El dominio no debe depender de una sesion de persistencia abierta en la vista.
spring.jpa.open-in-view=false

# --- Esquema de base de datos: lo versiona Flyway, no Hibernate ---
# Decision del 2026-09-21 (SCRUM-161). Con tres bases Supabase y sin migraciones
# habria que crear el esquema a mano tres veces y mantenerlo sincronizado; con
# Flyway el cambio viaja como un .sql revisable en el PR y se aplica igual en los
# tres ambientes. Es tambien la respuesta a "como controlan los cambios de
# esquema?" ante el Comite de Arquitectura.
#
# Supabase entrega una sola base, siempre llamada 'postgres', asi que el
# aislamiento por ambiente lo da el esquema y el rol dueno, no una base aparte.
# El rol fusaroute_dev ya trae search_path=fusaroute, pero se declara explicito
# aqui para que el arranque no dependa de una propiedad del rol en el servidor.
spring.flyway.schemas=${DB_SCHEMA:fusaroute}
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:fusaroute}
