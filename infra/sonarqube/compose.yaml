# SonarQube autohospedado (SCRUM-181, RNF-05).
#
# Donde corre: VM Always-Free de Oracle Cloud (ARM Ampere A1, Ubuntu).
# Por que: el ticket exige "unicamente desde Docker" y el proyecto no tiene
# presupuesto para un SaaS; Ampere A1 es gratis 24/7 y publica IP publica.
#
# Imagen: sonarqube community con manifiesto arm64/v8 verificado el 2026-10-27
# en Docker Hub. Version pineada para que el host sea reproducible: una
# actualizacion mayor exige una migracion de BD y no debe pasar sola.
#
# Antes del primer `docker compose up -d` en la VM:
#   sudo sysctl -w vm.max_map_count=262144
#   sudo sysctl -w fs.file-max=131072
#   # y persistirlos en /etc/sysctl.d/99-sonarqube.conf
# Elasticsearch (dentro del contenedor de SonarQube) no arranca sin eso.
#
# Secretos: NUNCA se commitean. Copiar .env.example a .env en la VM y llenarlo
# ahi. Las variables se leen por `env_file`, no por `environment:` literal.
#
# Endurecimiento obligatorio:
#  - Cambiar la contrasena admin por defecto (admin/admin) en el primer login.
#  - Poner un reverse proxy con HTTPS (Caddy/Traefik + Let's Encrypt, o
#    Cloudflare delante). SonarQube en HTTP publico es superficie de ataque.
#  - Firewall: abrir solo 443 al mundo; 9000 queda solo en la red local del
#    docker compose, nunca expuesto directamente.

services:
  sonarqube:
    image: sonarqube:26.10.0.133078-community
    container_name: sonarqube
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://db:5432/sonar
      SONAR_JDBC_USERNAME: ${SONAR_DB_USER}
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD}
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    ports:
      # Solo escucha en loopback: el reverse proxy en el host hace TLS y
      # expone 443 al mundo. Nunca publicar 9000 directo.
      - "127.0.0.1:9000:9000"
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  db:
    image: postgres:17.6-alpine
    container_name: sonarqube-db
    env_file: .env
    environment:
      POSTGRES_USER: ${SONAR_DB_USER}
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD}
      POSTGRES_DB: sonar
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SONAR_DB_USER} -d sonar"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  postgresql_data:
