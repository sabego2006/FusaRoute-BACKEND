name: database-backup

on:
  schedule:
    - cron: '0 0 * * *' # Daily at midnight UTC
  workflow_dispatch: # Allow manual trigger

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL Client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Run pg_dump
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          # Resolve IPv4 address using getent
          DB_HOST_DNS=${{ secrets.SUPABASE_DB_HOST }}
          DB_HOST_IPV4=$(getent hosts $DB_HOST_DNS | awk '{ print $1 }' | grep -E '^[0-9.]+$' | head -n 1)

          if [ -z "$DB_HOST_IPV4" ]; then
            echo "Using DNS host as fallback: $DB_HOST_DNS"
            FINAL_HOST=$DB_HOST_DNS
          else
            echo "Using resolved IPv4 address: $DB_HOST_IPV4"
            FINAL_HOST=$DB_HOST_IPV4
          fi

          # Use connection string to force SSL and specific host
          pg_dump "sslmode=require host=$FINAL_HOST port=5432 user=postgres dbname=postgres" \
                 -F c \
                 -f backup_$(date +%Y%m%d).dump

      - name: Upload Backup to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup
          path: backup_*.dump
          retention-days: 7
