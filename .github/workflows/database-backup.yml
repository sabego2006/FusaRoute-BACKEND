name: database-backup

on:
  schedule:
    - cron: '0 0 * * *' # Daily at midnight UTC
  workflow_dispatch: # Allow manual trigger

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve Host to IPv4 and Force Connection
        run: |
          # Resolve the hostname to an IPv4 address to bypass IPv6 routing issues
          IP=$(dig +short A ${{ secrets.SUPABASE_DB_HOST }} | tail -n1)
          if [ -z "$IP" ]; then
            echo "Could not resolve host to IPv4"
            exit 1
          fi
          echo "Resolved ${{ secrets.SUPABASE_DB_HOST }} to $IP"
          echo "$IP ${{ secrets.SUPABASE_DB_HOST }}" | sudo tee -a /etc/hosts

      - name: Run pg_dump
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          pg_dump "sslmode=require host=${{ secrets.SUPABASE_DB_HOST }} port=5432 user=postgres dbname=postgres" \
                 -F c \
                 -f backup_$(date +%Y%m%d).dump

      - name: Upload Backup to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup
          path: backup_*.dump
          retention-days: 7
