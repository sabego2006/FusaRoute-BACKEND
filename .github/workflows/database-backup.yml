name: database-backup

on:
  schedule:
    - cron: '0 0 * * *' # Daily at midnight UTC
  workflow_dispatch: # Allow manual trigger

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve Host to IPv4 and Force Connection
        run: |
          echo "Attempting to resolve ${{ secrets.SUPABASE_DB_HOST }}..."
          # Try multiple tools to resolve IPv4
          IP=$(nslookup ${{ secrets.SUPABASE_DB_HOST }} | grep -A 1 "Name:" | grep "Address" | awk '{print $2}' | head -n1)

          if [ -z "$IP" ]; then
            IP=$(dig +short A ${{ secrets.SUPABASE_DB_HOST }} | grep -E '^[0-9.]+$' | head -n1)
          fi

          if [ -z "$IP" ]; then
            echo "Automatic resolution failed. Checking for SUPABASE_DB_IP secret..."
            IP=${{ secrets.SUPABASE_DB_IP }}
          fi

          if [ -z "$IP" ]; then
            echo "Error: Could not resolve host to IPv4 and no SUPABASE_DB_IP secret provided."
            exit 1
          fi

          echo "Using IP: $IP"
          echo "$IP ${{ secrets.SUPABASE_DB_HOST }}" | sudo tee -a /etc/hosts

      - name: Run pg_dump
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          pg_dump "sslmode=require host=${{ secrets.SUPABASE_DB_HOST }} port=5432 user=postgres dbname=postgres" \
                 -F c \
                 -f backup_$(date +%Y%m%d).dump

      - name: Upload Backup to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup
          path: backup_*.dump
          retention-days: 7
