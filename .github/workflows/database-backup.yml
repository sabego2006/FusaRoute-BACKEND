name: database-backup

on:
  schedule:
    - cron: '0 0 * * *' # Daily at midnight UTC
  workflow_dispatch: # Allow manual trigger

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Disable IPv6
        run: |
          sudo sysctl -w net.ipv6.conf.all.disable_ipv6=1
          sudo sysctl -w net.ipv6.conf.default.disable_ipv6=1

      - name: Install PostgreSQL Client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client dnsutils

      - name: Run pg_dump
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          # El DNS del runner no resuelve el host de forma confiable (ni con IPv6
          # deshabilitado); se consulta explícitamente contra un resolver público
          # para obtener la IPv4 y se usa esa IP directa en la conexión.
          IP=$(dig +short A @8.8.8.8 ${{ secrets.SUPABASE_DB_HOST }} | tail -n1)
          if [ -z "$IP" ]; then
            IP=$(dig +short A @1.1.1.1 ${{ secrets.SUPABASE_DB_HOST }} | tail -n1)
          fi
          if [ -z "$IP" ]; then
            echo "Error: no se pudo resolver ${{ secrets.SUPABASE_DB_HOST }} ni con 8.8.8.8 ni con 1.1.1.1"
            exit 1
          fi
          echo "Resuelto a $IP"

          pg_dump "sslmode=require host=$IP port=5432 user=postgres dbname=postgres" \
                 -F c \
                 -f backup_$(date +%Y%m%d).dump

      - name: Upload Backup to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup
          path: backup_*.dump
          retention-days: 7
