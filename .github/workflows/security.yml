# Gate de seguridad BLOQUEANTE, y deterministico a proposito.
#
# Por que existe separado de .github/workflows/security-nvd-watch.yml: un check
# de CI debe ser funcion del commit. Hasta el 2026-09-27 este job resolvia la
# base de la NVD en cada corrida, asi que el mismo codigo podia dar verde el
# sabado y rojo el lunes solo porque el NIST publico CVEs nuevas en la noche.
# Eso no es un gate, es un chequeo inestable: le pone rojo al PR de quien no
# rompio nada y entrena al equipo a ignorar el color.
#
# Ahora el escaneo corre contra un SNAPSHOT fijo de la NVD, que solo cambia
# cuando el workflow de vigilancia lo actualiza (semanal o a mano). Asi este
# job responde una sola pregunta, la que le corresponde: las dependencias de
# ESTE commit, tienen vulnerabilidades conocidas al momento del snapshot.
#
# Descubrir CVEs nuevas es otra pregunta y vive en el otro workflow, que no
# bloquea ningun PR. El umbral NO se toca: failBuildOnCVSS sigue en 7 en el
# pom.xml. Esto hace el gate estable, no permisivo.
name: Seguridad

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  owasp-dependency-check:
    runs-on: ubuntu-latest
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      # La base de la NVD vive FUERA de ~/.m2 a proposito. Antes se intentaba
      # excluirla del cache de Maven con el patron "!~/.m2/.../dependency-check-data",
      # y esa exclusion NO funciona: actions/cache no expande el ~ en un patron de
      # negacion, asi que la base viajaba dentro del cache de Maven (212 MiB en vez
      # de ~92) y se restauraba por una llave distinta, dependiente del hash del
      # pom.xml. El escaneo dejaba de ser reproducible sin que se notara: la corrida
      # 36299172832 dio "verde en frio" en 21 s porque encontro una base que
      # supuestamente no estaba ahi. Con dataDirectory apuntando al workspace, cada
      # cache guarda exactamente lo suyo.
      - name: Cachear dependencias de Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      # Solo restaura, nunca guarda: el dueño del snapshot es el workflow de
      # vigilancia. Si este job guardara, cada corrida dejaría ~1 GB nuevo y se
      # comería el presupuesto de caché del repositorio.
      - name: Restaurar el snapshot de la NVD
        id: snapshot
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.nvd-data
          key: nvd-snapshot-v2-${{ runner.os }}
          restore-keys: |
            nvd-snapshot-v2-${{ runner.os }}

      # Guardarrail: un comentario XML con dos guiones seguidos deja el archivo
      # de supresiones sin parsear, y Dependency-Check solo lo avisa con un
      # WARNING que se pierde en el log. Paso el 2026-09-26 y dejo el job rojo
      # tres dias. Esto falla en milisegundos y de forma ruidosa.
      # Se valida con python3 (viene en la imagen) y no con xmllint, que NO
      # esta instalado en ubuntu-latest: el primer intento de este paso murio
      # con "xmllint: command not found".
      - name: Validar el XML de supresiones
        run: python3 -c "import sys,xml.dom.minidom; xml.dom.minidom.parse(sys.argv[1]); print('suppression.xml parsea')" config/owasp/suppression.xml

      # Camino normal: hay snapshot, se escanea contra el y NO se actualiza.
      # autoUpdate=false es lo que hace el resultado reproducible.
      - name: Escanear contra el snapshot fijo de la NVD
        if: steps.snapshot.outputs.cache-matched-key != ''
        run: |
          echo "Snapshot de la NVD: ${{ steps.snapshot.outputs.cache-matched-key }}"
          mvn -B -Psecurity org.owasp:dependency-check-maven:check -DautoUpdate=false -DdataDirectory=${{ github.workspace }}/.nvd-data

      # Camino de arranque en frio: todavia no existe snapshot (primera corrida
      # con este workflow, o el cache expiro por los 7 dias sin uso de GitHub).
      # Se descarga la NVD y se siembra el snapshot, para que las corridas
      # siguientes ya sean deterministas. Sin esto el job fallaria por falta de
      # datos, que es un rojo inutil.
      - name: Escanear descargando la NVD (no habia snapshot)
        if: steps.snapshot.outputs.cache-matched-key == ''
        run: |
          echo "No habia snapshot de la NVD; se descarga y se siembra."
          mvn -B -Psecurity org.owasp:dependency-check-maven:check -DdataDirectory=${{ github.workspace }}/.nvd-data

      - name: Sembrar el snapshot de la NVD
        if: always() && steps.snapshot.outputs.cache-matched-key == ''
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.nvd-data
          key: nvd-snapshot-v2-${{ runner.os }}

      - name: Subir reporte OWASP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-owasp
          path: target/dependency-check-report.*
          if-no-files-found: ignore
