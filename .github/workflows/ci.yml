name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      # Secrets de SonarQube (SCRUM-181). Sin ellos el paso de analisis
      # queda SKIPPED, no FAILED: asi el CI no se enrojece antes de que
      # el admin monte la VM y guarde los secrets. Con ambos presentes
      # el paso corre y un fallo del scanner tumba el CI.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
    steps:
      - name: Checkout
        # Sonar usa el historial para blame y new-code; sin fetch-depth 0
        # las fechas de autoria quedan vacias.
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Cache de SonarQube
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: sonar-${{ runner.os }}
          restore-keys: sonar-${{ runner.os }}

      - name: Build y tests
        # mvn verify ya produce target/site/jacoco/jacoco.xml via el plugin
        # de JaCoCo configurado en pom.xml; Sonar lo ingiere mas abajo.
        run: mvn -B verify

      - name: Analisis SonarQube
        # Guard: sin secrets el paso queda SKIPPED (ver env del job). Con
        # secrets el paso es bloqueante: un fallo del scanner tumba el CI.
        # qualitygate.wait=false mantiene el gate informativo hasta que
        # domain/ y application/ tengan codigo real; luego se vuelve true.
        if: env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != ''
        run: >
          mvn -B
          org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar
          -Dsonar.host.url=$SONAR_HOST_URL
          -Dsonar.token=$SONAR_TOKEN
          -Dsonar.qualitygate.wait=false 