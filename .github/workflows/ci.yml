name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      # Secret de SonarCloud (SCRUM-181). Sin el token el paso de analisis
      # queda SKIPPED, no FAILED: asi el CI no se enrojece antes de que el
      # admin importe el repo y guarde el secret. Con el token presente el
      # paso corre y un fallo del scanner tumba el CI. El host ya no es un
      # secret: es siempre https://sonarcloud.io (ver el paso de analisis).
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout
        # Sonar usa el historial para blame y new-code; sin fetch-depth 0
        # las fechas de autoria quedan vacias.
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Cache de SonarQube
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: sonar-${{ runner.os }}
          restore-keys: sonar-${{ runner.os }}

      - name: Build y tests
        # mvn verify ya produce target/site/jacoco/jacoco.xml via el plugin
        # de JaCoCo configurado en pom.xml; Sonar lo ingiere mas abajo.
        run: mvn -B verify

      - name: Analisis SonarCloud
        # Guard: sin token el paso queda SKIPPED (ver env del job). Con
        # token el paso es bloqueante: un fallo del scanner tumba el CI.
        # El host va explicito: sonar-maven-plugin sin sonar.host.url cae a
        # http://localhost:9000, no a SonarCloud.
        # qualitygate.wait=false mantiene el gate informativo hasta que
        # domain/ y application/ tengan codigo real; luego se vuelve true.
        if: env.SONAR_TOKEN != ''
        run: >
          mvn -B
          org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.token=$SONAR_TOKEN
          -Dsonar.qualitygate.wait=false 